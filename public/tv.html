<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<link rel="icon" href="icon.svg">
<title>Show Control screen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; cursor: none; }
  #stage { position: fixed; inset: 0; }
  .livevid, .livevid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .vmsg { position: absolute; inset: 0; display: grid; place-items: center; color: #8b94a1; font-size: 2.2vw; text-align: center; padding: 5vw; }
  .vmsg[hidden] { display: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 3vw; align-items: flex-end; padding: 2vw 3vw; background: linear-gradient(transparent, #000d 40%); font-size: 2.4vw; }
  #bar .grow { flex: 1; min-width: 0; }
  #bar small { display: block; font-size: .55em; letter-spacing: .12em; color: #e7b416; font-weight: 700; }
  #bar .big { font-size: 1.5em; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .t { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; white-space: nowrap; }
  #bar .t small { color: #8b94a1; text-align: right; }
  body.lobby #bar small { color: #8b94a1; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  #msg[hidden], #bar[hidden] { display: none; }
  #msg form { display: grid; gap: 12px; } #msg input, #msg button { font-size: 24px; padding: 10px; border-radius: 10px; }
  #msg a { color: #9cc4ff; display: block; margin: 8px; font-size: 22px; }
  .night video { filter: brightness(2.2) contrast(1.3) grayscale(.6); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar" hidden></div>
<div id="msg">Connecting to Show Control…</div>
<script src="player.js"></script>
<script>
// Backstage / lobby screen: one camera full screen with the standby cue (backstage) or the show
// name (lobby), and the clock. View only: it cannot fire anything.
'use strict';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') === 'lobby' ? 'lobby' : 'backstage';
document.body.classList.add(mode);
const $ = id => document.getElementById(id);
let S = { devices: {}, show: null, skew: 0 }, player = null, playing = null;
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function camera() {
  const id = q.get('cam'), cam = S.devices[id];
  if (!id || !cam) {
    const cams = Object.values(S.devices).filter(d => d.state?.stream);
    $('msg').hidden = false;
    $('msg').innerHTML = `<div><h1>Pick a camera for this screen</h1>${cams.map(c => { const u = new URLSearchParams(q); u.set('cam', c.id); return `<a href="?${u}">${esc(c.name)}</a>`; }).join('') || 'No cameras with video yet.'}</div>`;
    return;
  }
  $('msg').hidden = true;
  const s = cam.state.stream || {};
  if (playing === id + s.type) return;
  playing = id + s.type;
  player?.close(); player = null;
  const stage = $('stage');
  stage.classList.toggle('night', cam.type === 'camera' && !!cam.state.night);
  if (s.type === 'live') { player = LiveVideo.create(s.src || id); stage.replaceChildren(player.el); }
  else if (s.type === 'mjpeg') { const img = new Image(); img.src = s.url; img.className = 'livevid'; img.style.objectFit = 'contain'; stage.replaceChildren(img); }
  else stage.innerHTML = `<div class="vmsg">${s.type === 'sim' ? `${esc(cam.name)}: practice camera, no real picture` : `${esc(cam.name)} has no video address`}</div>`;
}

function bar() {
  const sh = S.show; if (!sh) return;
  const now = Date.now() + S.skew, tm = sh.timers.show;
  const run = tm.acc + (tm.start ? now - tm.start : 0);
  const clock = new Date(now).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const b = $('bar'); b.hidden = false;
  if (mode === 'lobby') {
    b.innerHTML = `<div class="grow"><small>${tm.start ? 'Performance in progress' : run ? 'Interval' : 'Welcome to'}</small><div class="big">${esc(sh.name)}</div></div><div class="t">${clock}</div>`;
  } else {
    const next = sh.cues[sh.index], last = sh.cues[sh.lastFired];
    b.innerHTML = `<div class="grow"><small>STANDBY</small><div class="big">${next ? `${esc(next.number ?? sh.index + 1)} &nbsp;${esc(next.label)}` : 'End of show'}</div>${last ? `<div style="opacity:.6;font-size:.7em">Last: ${esc(last.number ?? sh.lastFired + 1)} ${esc(last.label)}</div>` : ''}</div>
      <div class="t"><small>RUNNING</small>${fmt(run)}</div><div class="t"><small>TIME</small>${clock}</div>`;
  }
}
setInterval(bar, 1000);

function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'auth-required') {
      const pin = localStorage.getItem('pin');
      if (q.get('key')) ws.send(JSON.stringify({ t: 'auth', key: q.get('key') }));
      else if (pin) ws.send(JSON.stringify({ t: 'auth', pin }));
      else askPin(ws);
    } else if (m.t === 'auth-failed') { localStorage.removeItem('pin'); $('msg').hidden = false; $('msg').textContent = 'This screen link is out of date (the PIN changed). Get a new one from System > Camera screens and phone cameras.'; }
    else if (m.t === 'init') {
      document.cookie = `sc=${m.token}; path=/; SameSite=Strict`;
      S.devices = Object.fromEntries(m.devices.map(d => [d.id, d])); S.show = m.show; S.skew = m.show.now - Date.now();
      playing = null; camera(); bar();
    } else if (m.t === 'device') { const was = S.devices[m.device.id]; S.devices[m.device.id] = m.device; if (!was || m.device.id === q.get('cam')) camera(); }
    else if (m.t === 'device-removed') { delete S.devices[m.id]; if (m.id === q.get('cam')) { playing = null; camera(); } }
    else if (m.t === 'show') { S.show = m.show; S.skew = m.show.now - Date.now(); bar(); }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
function askPin(ws) {
  $('msg').hidden = false;
  $('msg').innerHTML = '<form><div>Show Control PIN</div><input type="password" inputmode="numeric" autofocus><button>OK</button></form>';
  $('msg').querySelector('form').onsubmit = e => { e.preventDefault(); const pin = e.target.querySelector('input').value; localStorage.setItem('pin', pin); ws.send(JSON.stringify({ t: 'auth', pin })); };
}
// keep the screen on
async function awake() { try { await navigator.wakeLock?.request('screen'); } catch { /* not allowed */ } }
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && awake());
awake();
connect();
</script>
</body>
</html>
