# Runs every test against the simulated equipment on each pull request, so a change that breaks
# something shows up before it is merged (the release build runs the same tests again).
name: Test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# a newer push to the same pull request replaces a run still going
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
